<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ครอบครัว Oracle — Field Log</title>
<style>

  :root {
    --bg-void: #0a120e;
    --bg-deep: #050907;
    --moon:    #eef3ec;
    --mist:    #7c9083;
    --mist-dim: #4c5c53;
    --trail:   #e0a458;
    --firefly: #ffd873;
    --card-bg:     rgba(9, 16, 12, 0.74);
    --card-border: rgba(224, 164, 88, 0.32);

    --maru-base:  #c2601f;
    --maru-cream: #f6efe2;

    --chockdee-base:   #5c2419;
    --chockdee-ridge:  #331209;
    --chockdee-tongue: #d1636b;

    --font-display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', 'Noto Serif Thai', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Sarabun', 'Noto Sans Thai', sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Noto Sans Mono', Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse 900px 500px at 85% 8%, rgba(238,243,236,0.05), transparent 60%),
      linear-gradient(180deg, var(--bg-void) 0%, var(--bg-deep) 100%);
    color: var(--moon);
    font-family: var(--font-body);
    overflow-x: hidden;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 24px 40px;
  }

  .masthead { text-align: center; margin-bottom: 8px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--trail);
    opacity: 0.85;
    margin: 0 0 14px;
  }

  h1.title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 6vw, 56px);
    margin: 0 0 12px;
    letter-spacing: 0.5px;
    text-wrap: balance;
    color: var(--moon);
  }

  .lede {
    font-size: 15px;
    line-height: 1.7;
    color: var(--mist);
    max-width: 46ch;
    margin: 0 auto;
  }

  .scene-wrap {
    margin-top: 18px;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.45));
  }

  svg.scene { width: 100%; height: auto; display: block; overflow: visible; }

  /* ---- field-note cards (inside foreignObject) ---- */
  .tag {
    font-family: var(--font-body);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    padding: 14px 16px 16px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.35);
  }
  .tag-role {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--trail);
    border: 1px solid var(--card-border);
    border-radius: 2px;
    padding: 2px 7px;
    margin-bottom: 8px;
  }
  .tag-name {
    font-family: var(--font-display);
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 2px;
    color: var(--moon);
  }
  .tag-me {
    font-size: 11.5px;
    font-style: italic;
    color: var(--firefly);
    opacity: 0.9;
    margin: 0 0 8px;
  }
  .tag-breed {
    font-size: 13px;
    color: var(--mist);
    margin: 0 0 10px;
  }
  .tag-traits {
    list-style: none;
    margin: 0;
    padding: 10px 0 0;
    border-top: 1px solid var(--card-border);
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--mist);
    letter-spacing: 0.2px;
  }
  .tag-traits li::before { content: "· "; color: var(--trail); }

  .tag-photo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 10px;
  }
  .tag-photo img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--card-border);
  }
  .tag-photo span {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--mist-dim);
    letter-spacing: 0.3px;
  }

  .colophon {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--mist-dim);
    letter-spacing: 0.3px;
  }

  /* ---- motion ---- */

  .reveal {
    opacity: 0;
    animation: revealPop 0.9s cubic-bezier(.2,.8,.25,1) forwards;
  }
  .reveal--argon    { animation-delay: 0.3s; }
  .reveal--maru      { animation-delay: 1.9s; }
  .reveal--chockdee { animation-delay: 3.5s; }

  @keyframes revealPop {
    0%   { opacity: 0; transform: translateY(16px) scale(0.82); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .trail-glow {
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    animation: drawTrail 3.4s 0.2s ease-in-out forwards;
  }
  @keyframes drawTrail { to { stroke-dashoffset: 0; } }

  .paw {
    opacity: 0;
    animation: pawFade 1s ease-out forwards;
  }
  .paw--a { animation-delay: 1.1s; }
  .paw--b { animation-delay: 1.6s; }
  .paw--c { animation-delay: 2.7s; }
  .paw--d { animation-delay: 3.2s; }
  @keyframes pawFade { to { opacity: 0.55; } }

  .firefly { animation: fireflyDrift var(--fd, 9s) ease-in-out infinite; animation-delay: var(--fdelay, 0s); }
  @keyframes fireflyDrift {
    0%   { transform: translate(0, 0); opacity: 0.15; }
    25%  { opacity: 0.9; }
    50%  { transform: translate(10px, -16px); opacity: 0.35; }
    75%  { opacity: 0.85; }
    100% { transform: translate(-6px, 4px); opacity: 0.15; }
  }

  .moon-pulse { animation: moonPulse 6s ease-in-out infinite; }
  @keyframes moonPulse {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 0.75; }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; }
    .trail-glow { animation: none; stroke-dashoffset: 0; }
    .paw { animation: none; opacity: 0.55; }
    .firefly, .moon-pulse { animation: none; }
  }

</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <p class="eyebrow">ψ Field Log · Trailhound</p>
    <h1 class="title">ครอบครัว Oracle</h1>
    <p class="lede">"จมูกไม่เคยหลอกลวง" — ตามรอยจากพี่ใหญ่ถึงน้องใหม่ ทีละก้าวในป่าเดียวกัน</p>
  </header>

  <div class="scene-wrap">
    <svg class="scene" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">

            <feMergeNode in="SourceGraphic"/>

        </filter>
        <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f5f8f2" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#f5f8f2" stop-opacity="0"/>
        </radialGradient>
        <symbol id="paw" viewBox="-10 -10 20 20">
          <ellipse cx="0" cy="4" rx="6" ry="5"/>
          <ellipse cx="-6" cy="-4" rx="2.4" ry="3"/>
          <ellipse cx="-1.5" cy="-7.4" rx="2.3" ry="3"/>
          <ellipse cx="4" cy="-6" rx="2.3" ry="3"/>
          <ellipse cx="8" cy="-1.5" rx="2" ry="2.6"/>
        </symbol>
      </defs>

      <!-- sky / canopy -->
      <rect x="0" y="0" width="1200" height="760" fill="none"/>
      <circle class="moon-pulse" cx="1080" cy="92" r="100" fill="url(#moonGrad)"/>
      <circle cx="1080" cy="92" r="42" fill="var(--moon)" opacity="0.92"/>

      <path d="M0,760 L0,730 L90,712 L190,738 L300,708 L410,734 L520,706

      <!-- the scent trail -->

            stroke-linecap="round" opacity="0.75" filter="url(#glow)"

      <use class="paw paw--a" href="#paw" x="320" y="420" width="20" height="20" transform="rotate(24 330 430)" fill="var(--trail)"/>
      <use class="paw paw--b" href="#paw" x="490" y="316" width="20" height="20" transform="rotate(8 500 326)" fill="var(--trail)"/>
      <use class="paw paw--c" href="#paw" x="710" y="238" width="20" height="20" transform="rotate(-14 720 248)" fill="var(--trail)"/>
      <use class="paw paw--d" href="#paw" x="890" y="332" width="20" height="20" transform="rotate(-28 900 342)" fill="var(--trail)"/>

      <circle r="4.5" fill="var(--firefly)" filter="url(#glow)">
        <animateMotion dur="7s" begin="3.9s" repeatCount="indefinite" rotate="auto">
          <mpath href="#trailPath"/>

      <!-- ================= ARGON — พี่ใหญ่ · Rottweiler (voxel) ================= -->

        </g>

      </g>

      <!-- ================= MARU — ตัวกลาง · Shiba Inu (voxel) ================= -->
      <g transform="translate(600,300) scale(0.92)">

          <g transform="translate(-40,-56)">
            <g id="mm-tail">

      </g>

      <g class="reveal reveal--chockdee">

          <g transform="translate(-42,-30)">

            <g id="cd-leg3">

            </g>

              <animateTransform attributeName="transform" type="rotate" values="17;-17;17" keyTimes="0;0.5;1" dur="0.5s" repeatCount="indefinite"/>
            </g>

          <g transform="translate(34,-72)">
            <g id="cd-head">
              <animateTransform attributeName="transform" type="rotate" values="0;4;0" keyTimes="0;0.5;1" dur="0.9s" repeatCount="indefinite"/>
            </g>

        </g>
      </g>
      </g>

<script>
(function () {
  var SVGNS = "http://www.w3.org/2000/svg";

  function hexToRgb(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(rgb) {
    return "#" + rgb.map(function (v) {
      v = Math.max(0, Math.min(255, Math.round(v)));
      return v.toString(16).padStart(2, "0");
    }).join("");
  }
  function shade(hex, amt) {
    var rgb = hexToRgb(hex).map(function (v) {
      return amt >= 0 ? v + (255 - v) * amt : v * (1 + amt);
    });
    return rgbToHex(rgb);
  }
  // Draws one blocky "voxel" box as 3 flat facets (top / side / front) to
  // fake extrusion without CSS 3D, which SVG does not support.
  function mcBox(parent, x, y, w, h, color, depth) {
    depth = depth || 9;
    var dx = depth, dy = -depth * 0.55;
    var top = shade(color, 0.22);
    var side = shade(color, -0.24);
    function poly(pts, fill) {
      var p = document.createElementNS(SVGNS, "polygon");
      p.setAttribute("points", pts.map(function (pt) { return pt.join(","); }).join(" "));
      p.setAttribute("fill", fill);
      parent.appendChild(p);
    }
    poly([[x, y], [x + w, y], [x + w + dx, y + dy], [x + dx, y + dy]], top);
    poly([[x + w, y], [x + w + dx, y + dy], [x + w + dx, y + h + dy], [x + w, y + h]], side);
    poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], color);
  }
  function rect(parent, x, y, w, h, fill) {
    var r = document.createElementNS(SVGNS, "rect");
    r.setAttribute("x", x); r.setAttribute("y", y);
    r.setAttribute("width", w); r.setAttribute("height", h);
    r.setAttribute("fill", fill);
    parent.appendChild(r);
  }
  function dot(parent, cx, cy, r, fill) {
    var c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", r);
    c.setAttribute("fill", fill);
    parent.appendChild(c);
  }

  var BLACK = "#1c1b20", TAN = "#c07f38", INK = "#0a0704";

  ["mc-leg1", "mc-leg2", "mc-leg3", "mc-leg4"].forEach(function (id) {
    var g = document.getElementById(id);
    if (!g) return;
    mcBox(g, 0, 0, 13, 30, BLACK, 6);
    mcBox(g, 0, 21, 13, 9, TAN, 6);
  });

  var body = document.getElementById("mc-body");
  if (body) {
    mcBox(body, -46, -64, 84, 42, BLACK, 10);
    mcBox(body, 20, -40, 18, 20, TAN, 10);
  }

  var tail = document.getElementById("mc-tail");
  if (tail) mcBox(tail, 0, -26, 12, 26, BLACK, 7);

  var head = document.getElementById("mc-head");
  if (head) {
    mcBox(head, -16, -30, 32, 32, BLACK, 9);
    mcBox(head, 14, -20, 16, 14, BLACK, 7);
    mcBox(head, -12, -42, 9, 13, BLACK, 5);
    mcBox(head, 2, -42, 9, 13, BLACK, 5);
    rect(head, -8, -26, 5, 4, TAN);
    rect(head, 2, -25, 5, 4, TAN);
    rect(head, 14, -10, 14, 6, TAN);
    dot(head, -2, -18, 2, INK);
    dot(head, 28, -15, 2, INK);
  }

  var rootStyle = getComputedStyle(document.documentElement);
  function cssVar(name) { return rootStyle.getPropertyValue(name).trim(); }

  // ---- Maru: Shiba Inu, calm — smaller build, curled tail as a stepped arc of blocks ----
  var MARU = cssVar("--maru-base"), MARU_CREAM = cssVar("--maru-cream");

  ["mm-leg1", "mm-leg2", "mm-leg3", "mm-leg4"].forEach(function (id) {
    var g = document.getElementById(id);
    if (!g) return;
    mcBox(g, 0, 0, 12, 28, MARU, 6);
    mcBox(g, 0, 20, 12, 8, MARU_CREAM, 6);
  });

  var mmBody = document.getElementById("mm-body");
  if (mmBody) {
    mcBox(mmBody, -42, -58, 78, 38, MARU, 9);
    mcBox(mmBody, 18, -36, 16, 18, MARU_CREAM, 9);
  }

  var mmTail = document.getElementById("mm-tail");
  if (mmTail) {
    var mmCurl = [
      [-8, -5, MARU], [-13, -14, MARU], [-10, -23, MARU],
      [-3, -27, MARU], [4, -23, MARU_CREAM]
    ];
    mmCurl.forEach(function (b) { mcBox(mmTail, b[0] - 5, b[1] - 5, 10, 10, b[2], 5); });
  }

  var mmHead = document.getElementById("mm-head");
  if (mmHead) {
    mcBox(mmHead, -14, -26, 28, 28, MARU, 8);
    mcBox(mmHead, 12, -16, 14, 11, MARU, 6);
    mcBox(mmHead, -10, -36, 8, 11, MARU, 4);
    mcBox(mmHead, 2, -36, 8, 11, MARU, 4);
    rect(mmHead, 10, -8, 14, 5, MARU_CREAM);
    rect(mmHead, -4, -16, 4, 1.5, INK);
    dot(mmHead, 24, -11, 1.8, INK);
  }

  // ---- Chockdee: Thai Ridgeback, cheerful — large build, hooked tail, spine ridge, open mouth ----
  var CD = cssVar("--chockdee-base"), CD_RIDGE = cssVar("--chockdee-ridge"), CD_TONGUE = cssVar("--chockdee-tongue");

  ["cd-leg1", "cd-leg2", "cd-leg3", "cd-leg4"].forEach(function (id) {
    var g = document.getElementById(id);
    if (!g) return;
    mcBox(g, 0, 0, 13, 30, CD, 6);
  });

  var cdBody = document.getElementById("cd-body");
  if (cdBody) {
    mcBox(cdBody, -46, -64, 84, 42, CD, 10);
    [-30, -10, 10, 28].forEach(function (x) { mcBox(cdBody, x, -67, 12, 4, CD_RIDGE, 3); });
  }

  var cdTail = document.getElementById("cd-tail");
  if (cdTail) {
    var cdHook = [[-6, -4, CD], [-8, -14, CD], [1, -21, CD]];
    cdHook.forEach(function (b) { mcBox(cdTail, b[0] - 5, b[1] - 5, 10, 10, b[2], 5); });
  }

  var cdHead = document.getElementById("cd-head");
  if (cdHead) {
    mcBox(cdHead, -16, -30, 32, 32, CD, 9);
    mcBox(cdHead, 14, -20, 16, 14, CD, 7);
